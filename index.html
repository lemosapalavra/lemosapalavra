    <script>
      // Capture the PWA install prompt as early as possible so the login screen can offer it.
      window.__lemosDeferredInstall = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__lemosDeferredInstall = e;
        window.dispatchEvent(new Event('lemos_installable'));
      });
      window.addEventListener('appinstalled', () => {
        window.__lemosDeferredInstall = null;
        window.dispatchEvent(new Event('lemos_installed'));
      });

  <body>
    <style>
      #lemos-launch{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;overflow:hidden;text-align:center;background:radial-gradient(circle at 50% 38%,#287b7b 0%,#164d56 39%,#102d42 80%,#0b2336 100%);transition:opacity .4s ease}
      #lemos-launch::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,218,89,.27),transparent 47%)}
      #lemos-launch .launch-sun{position:relative;width:min(55vw,235px);aspect-ratio:1;border-radius:27%;box-shadow:0 0 45px 13px rgba(255,214,85,.5);animation:lemosLaunchFloat 2.5s ease-in-out infinite}
      #lemos-launch .launch-sun img{width:100%;height:100%;object-fit:contain;border-radius:25%}
      #lemos-launch h2{position:relative;margin:0;font:800 clamp(22px,6vw,32px)/1.15 system-ui,sans-serif;color:#ffe29a;text-shadow:0 2px 14px rgba(0,0,0,.6)}
      #lemos-launch p{position:relative;margin:0 22px;font:600 15px/1.5 system-ui,sans-serif;color:#fff7dd}
      #lemos-launch .launch-dots{position:relative;display:flex;gap:9px}
      #lemos-launch .launch-dots i{width:9px;height:9px;border-radius:50%;background:#ffdc73;animation:lemosDot 1.2s ease-in-out infinite alternate}
      #lemos-launch .launch-dots i:nth-child(2){animation-delay:.25s}#lemos-launch .launch-dots i:nth-child(3){animation-delay:.5s}
      @keyframes lemosLaunchFloat{50%{transform:translateY(-8px);filter:brightness(1.12)}}@keyframes lemosDot{to{opacity:.25;transform:scale(.6)}}
      @media(prefers-reduced-motion:reduce){#lemos-launch .launch-sun,#lemos-launch .launch-dots i{animation:none}}
    </style>
    <div id="lemos-launch" aria-label="Carregando Lemos a Palavra">
      <div class="launch-sun"><img src="/favicon.png" alt="Lemos a Palavra" /></div>
      <h2>Onde a Palavra ganha Vida!</h2>
      <p>Histórias, músicas e descobertas com fé e alegria.</p>
      <div class="launch-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <div id="root"></div>
    <script>
      // Executa mesmo se o bundle React falhar ao carregar: evita splash infinito.
      window.setTimeout(() => {
        const launch = document.getElementById("lemos-launch");
        if (!launch) return;
        const root = document.getElementById("root");
        if (root && root.childElementCount > 0) {
          launch.style.opacity = "0";
          launch.style.pointerEvents = "none";
          window.setTimeout(() => launch.remove(), 450);
          return;
        }
        const dots = launch.querySelector(".launch-dots");
        if (dots) dots.remove();
        const message = document.createElement("p");
        message.textContent = "Não foi possível iniciar o aplicativo. Tente atualizar a página.";
        message.setAttribute("role", "alert");
        launch.appendChild(message);
        const retry = document.createElement("button");
        retry.type = "button";
        retry.textContent = "Tentar novamente";
        retry.style.cssText = "position:relative;border:2px solid #ffe29a;border-radius:999px;padding:12px 22px;background:#ffe29a;color:#102d42;font:700 16px system-ui;cursor:pointer";
        retry.addEventListener("click", () => window.location.reload());
        launch.appendChild(retry);
      }, 10000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
